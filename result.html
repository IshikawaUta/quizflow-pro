---
layout: default
title: Hasil Ujian Anda
---

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div x-data="resultApp()" x-init="init()" class="min-h-screen p-4 md:p-8">
    
    <template x-if="loading">
        <div class="fixed inset-0 flex items-center justify-center bg-slate-950 z-50">
            <div class="flex flex-col items-center">
                <div class="w-16 h-16 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin mb-6"></div>
                <p class="text-slate-500 font-black italic tracking-[0.3em] animate-pulse uppercase text-xs">Menyusun Laporan...</p>
            </div>
        </div>
    </template>

    <div class="max-w-4xl mx-auto" x-show="!loading" x-cloak x-transition:enter="transition ease-out duration-700" x-transition:enter-start="opacity-0 translate-y-8">
        
        <div class="glass p-8 md:p-12 rounded-[3rem] shadow-2xl mb-8 relative overflow-hidden border border-slate-800 bg-slate-800/40">
            <div class="absolute -top-24 -right-24 w-80 h-80 bg-blue-600/10 rounded-full blur-[80px]"></div>
            <div class="absolute -bottom-24 -left-24 w-80 h-80 bg-emerald-600/10 rounded-full blur-[80px]"></div>

            <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-12">
                <div class="text-center md:text-left flex-1">
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-lg bg-blue-500/10 border border-blue-500/20 mb-6">
                        <span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>
                        <span class="text-[10px] uppercase tracking-[0.2em] text-blue-400 font-black">Official Result Certificate</span>
                    </div>
                    
                    <h2 class="text-3xl md:text-5xl font-black text-white italic mb-6 leading-tight uppercase tracking-tighter" x-text="data.quiz_title"></h2>
                    
                    <div class="bg-slate-950/60 rounded-[2.5rem] p-8 border border-slate-800/50 mb-8 space-y-6 backdrop-blur-xl">
                        <div class="flex items-center gap-5">
                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center text-white shadow-lg shadow-blue-900/40">
                                <i data-lucide="user" class="w-7 h-7"></i>
                            </div>
                            <div>
                                <p class="text-[10px] uppercase tracking-[0.2em] text-slate-500 font-black mb-1">Nama Siswa</p>
                                <p class="text-2xl font-black text-white uppercase tracking-tight" x-text="data.student_name"></p>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-6 pt-6 border-t border-slate-800/50">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center">
                                    <i data-lucide="list-ordered" class="w-4 h-4 text-slate-400"></i>
                                </div>
                                <div>
                                    <p class="text-[9px] uppercase text-slate-500 font-black">Absensi</p>
                                    <p class="font-bold text-slate-200" x-text="data.student_absent"></p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center">
                                    <i data-lucide="graduation-cap" class="w-4 h-4 text-slate-400"></i>
                                </div>
                                <div>
                                    <p class="text-[9px] uppercase text-slate-500 font-black">Kelas</p>
                                    <p class="font-bold text-slate-200" x-text="data.student_class"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="inline-flex items-center gap-3 px-8 py-4 rounded-2xl font-black text-xs tracking-[0.2em] shadow-2xl transition-all border uppercase"
                         :class="data.score >= 70 ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20'">
                        <i :data-lucide="data.score >= 70 ? 'verified' : 'alert-circle'" class="w-5 h-5"></i>
                        <span x-text="data.score >= 70 ? 'Status: Kompeten' : 'Status: Belum Kompeten'"></span>
                    </div>
                </div>

                <div class="relative flex items-center justify-center shrink-0">
                    <div class="w-56 h-56 md:w-64 md:h-64">
                        <canvas id="scoreChart"></canvas>
                    </div>
                    <div class="absolute flex flex-col items-center">
                        <span class="text-7xl md:text-8xl font-black text-white tracking-tighter leading-none" x-text="data.score"></span>
                        <span class="text-[10px] text-slate-500 font-black tracking-[0.4em] uppercase mt-2">Points</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-12 border-t border-slate-800 pt-8">
                <div class="bg-slate-900/40 p-5 rounded-3xl border border-slate-800 flex flex-col items-center md:items-start">
                    <span class="text-emerald-500 mb-2"><i data-lucide="check-circle-2" class="w-5 h-5"></i></span>
                    <p class="text-slate-500 text-[9px] uppercase font-black tracking-widest mb-1">Benar</p>
                    <p class="text-2xl font-black text-white" x-text="data.correct_count"></p>
                </div>
                <div class="bg-slate-900/40 p-5 rounded-3xl border border-slate-800 flex flex-col items-center md:items-start">
                    <span class="text-rose-500 mb-2"><i data-lucide="x-circle" class="w-5 h-5"></i></span>
                    <p class="text-slate-500 text-[9px] uppercase font-black tracking-widest mb-1">Salah</p>
                    <p class="text-2xl font-black text-white" x-text="data.wrong_count"></p>
                </div>
                <div class="bg-slate-900/40 p-5 rounded-3xl border border-slate-800 flex flex-col items-center md:items-start">
                    <span class="text-blue-500 mb-2"><i data-lucide="percent" class="w-5 h-5"></i></span>
                    <p class="text-slate-500 text-[9px] uppercase font-black tracking-widest mb-1">Akurasi</p>
                    <p class="text-2xl font-black text-white" x-text="data.score + '%'"></p>
                </div>
                <div class="bg-slate-900/40 p-5 rounded-3xl border border-slate-800 flex flex-col items-center md:items-start">
                    <span class="text-amber-500 mb-2"><i data-lucide="calendar" class="w-5 h-5"></i></span>
                    <p class="text-slate-500 text-[9px] uppercase font-black tracking-widest mb-1">Tgl Ujian</p>
                    <p class="text-[10px] font-black text-white mt-2 leading-tight uppercase" x-text="formatDate(data.completed_at)"></p>
                </div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-16">
            <button @click="window.print()" class="flex-1 bg-white text-slate-950 py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-slate-200 transition-all flex items-center justify-center gap-3 active:scale-95 shadow-xl">
                <i data-lucide="printer" class="w-4 h-4"></i> Cetak Hasil
            </button>
            <a href="/" class="flex-1 bg-slate-800 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-slate-700 transition-all flex items-center justify-center gap-3 border border-slate-700 active:scale-95">
                <i data-lucide="home" class="w-4 h-4"></i> Kembali ke Beranda
            </a>
        </div>

        <div class="space-y-6 mb-24">
            <div class="flex items-center gap-6 mb-10">
                <h3 class="text-xs font-black flex items-center gap-3 text-slate-500 uppercase tracking-[0.4em] whitespace-nowrap">
                    <i data-lucide="microscope" class="text-blue-500 w-5 h-5"></i> Analisis Per Soal
                </h3>
                <div class="h-px bg-slate-800 w-full"></div>
            </div>

            <template x-for="(question, index) in data.quiz_details" :key="index">
                <div class="glass border rounded-[2.5rem] p-8 md:p-10 transition-all duration-300"
                     :class="data.student_answers[index] === question.correct_answer_index ? 'border-emerald-500/20 bg-emerald-500/[0.02]' : 'border-rose-500/20 bg-rose-500/[0.02]'">
                    
                    <div class="flex gap-6 mb-8">
                        <span class="flex-shrink-0 w-12 h-12 rounded-2xl bg-slate-950 text-blue-500 border border-slate-800 flex items-center justify-center font-black italic shadow-inner" x-text="index + 1"></span>
                        <h4 class="text-lg md:text-xl font-bold text-slate-200 leading-relaxed pt-1" x-text="question.text"></h4>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 ml-0 md:ml-16">
                        <template x-for="(option, optIndex) in question.options" :key="optIndex">
                            <div class="p-5 rounded-2xl text-sm border flex justify-between items-center transition-all duration-300"
                                 :class="getOptionStyle(index, optIndex, question.correct_answer_index)">
                                
                                <div class="flex items-center gap-4">
                                    <span class="w-7 h-7 rounded-lg border border-current flex items-center justify-center text-[10px] font-black" x-text="String.fromCharCode(65 + optIndex)"></span>
                                    <div class="flex flex-col">
                                        <span class="font-medium" x-text="option"></span>
                                        <template x-if="data.student_answers[index] === optIndex">
                                            <span class="text-[8px] uppercase tracking-widest mt-1 font-black opacity-80">Pilihan Anda</span>
                                        </template>
                                    </div>
                                </div>
                                
                                <div class="flex items-center">
                                    <template x-if="optIndex === question.correct_answer_index">
                                        <div class="bg-emerald-500 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-lg shadow-emerald-900/40">
                                            <i data-lucide="check" class="w-3.5 h-3.5"></i>
                                        </div>
                                    </template>
                                    <template x-if="data.student_answers[index] === optIndex && optIndex !== question.correct_answer_index">
                                        <div class="bg-rose-500 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-lg shadow-rose-900/40">
                                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function resultApp() {
    return {
        loading: true,
        data: {
            quiz_title: '', student_name: '', student_absent: '', student_class: '',
            score: 0, correct_count: 0, wrong_count: 0,
            completed_at: '', student_answers: [], quiz_details: []
        },

        async init() {
            const urlParams = new URLSearchParams(window.location.search);
            const resultId = urlParams.get('id');

            if (!resultId) {
                window.location.href = '/';
                return;
            }

            try {
                const response = await fetch(`/.netlify/functions/get-result?id=${resultId}`);
                if (!response.ok) throw new Error("Data tidak ditemukan");
                this.data = await response.json();
            } catch (err) {
                console.error(err);
                alert("Hasil ujian tidak ditemukan atau telah dihapus.");
                window.location.href = '/';
            } finally {
                this.loading = false;
                this.$nextTick(() => {
                    this.renderChart();
                    if (window.lucide) lucide.createIcons();
                });
            }
        },

        renderChart() {
            const canvas = document.getElementById('scoreChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, '#3b82f6');
            gradient.addColorStop(1, '#2563eb');

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [this.data.correct_count, this.data.wrong_count],
                        backgroundColor: [gradient, '#0f172a'],
                        borderWidth: 0
                    }]
                },
                options: {
                    cutout: '85%',
                    responsive: true,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    animation: { duration: 2000, easing: 'easeOutQuart' }
                }
            });
        },

        getOptionStyle(qIdx, optIndex, correctIdx) {
            const studentAns = this.data.student_answers[qIdx];
            
            // 1. Opsi adalah KUNCI JAWABAN (Selalu Hijau)
            if (optIndex === correctIdx) {
                return 'bg-emerald-500/20 border-emerald-500 text-emerald-400 font-bold ring-1 ring-emerald-500/30';
            }
            
            // 2. Opsi adalah PILIHAN SISWA tapi SALAH (Merah)
            if (studentAns === optIndex && studentAns !== correctIdx) {
                return 'bg-rose-500/20 border-rose-500 text-rose-400 font-bold ring-1 ring-rose-500/30';
            }
            
            // 3. Opsi lainnya (Netral/Redup)
            return 'bg-slate-900/40 border-slate-800 text-slate-500 opacity-40';
        },

        formatDate(dateStr) {
            if (!dateStr) return "-";
            const date = new Date(dateStr);
            return date.toLocaleDateString('id-ID', { 
                day: '2-digit', month: 'short', year: 'numeric'
            }) + ' • ' + date.toLocaleTimeString('id-ID', { 
                hour: '2-digit', minute: '2-digit' 
            }).replace('.', ':');
        }
    }
}
</script>

<style>
    .glass { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(24px); }
    [x-cloak] { display: none !important; }
    
    @media print {
        .no-print { display: none; }
        body { background: white; color: black; }
        .glass { background: white; border: 1px solid #eee; backdrop-filter: none; box-shadow: none; }
        .text-white { color: #000 !important; }
        .text-slate-500, .text-slate-400 { color: #666 !important; }
    }
</style>
