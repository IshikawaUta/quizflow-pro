[build]
  command = "bundle exec jekyll build"
  publish = "_site"
  functions = "netlify/functions"

[dev]
  port = 8888
  publish = "_site"

[[redirects]]
  from = "/admin/create"
  to = "/admin/create.html"
  status = 200

[[redirects]]
  from = "/admin/edit"
  to = "/admin/edit.html"
  status = 200

[[redirects]]
  from = "/admin/rekap"
  to = "/admin/rekap.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404