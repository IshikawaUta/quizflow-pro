---
layout: default
title: Buat Ujian Baru
---

<div x-data="createApp()" class="max-w-4xl mx-auto py-12 px-6">
    <div class="flex items-center gap-4 mb-10">
        <a href="/admin" class="p-3 bg-slate-800 rounded-2xl hover:bg-slate-700 transition-all">
            <i data-lucide="arrow-left" class="text-white"></i>
        </a>
        <h1 class="text-3xl font-black italic text-white uppercase tracking-tighter">BUAT <span class="text-blue-500">UJIAN BARU</span></h1>
    </div>

    <div class="glass p-8 md:p-12 rounded-[3rem] border border-slate-800 shadow-2xl space-y-8 bg-slate-800/50">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Judul Ujian</label>
                <input type="text" x-model="quiz.title" placeholder="Misal: Ujian Tengah Semester Matematika" class="w-full bg-slate-900 border-none rounded-2xl p-4 focus:ring-2 focus:ring-blue-500 outline-none text-white font-bold">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Durasi (Menit)</label>
                <input type="number" x-model.number="quiz.duration" class="w-full bg-slate-900 border-none rounded-2xl p-4 focus:ring-2 focus:ring-blue-500 outline-none text-white font-bold">
            </div>
        </div>

        <hr class="border-slate-800">

        <div class="space-y-10">
            <template x-for="(q, index) in quiz.questions" :key="index">
                <div class="p-6 bg-slate-900/50 rounded-[2rem] border border-slate-800 relative group animate-fade">
                    <button @click="removeQuestion(index)" class="absolute -top-3 -right-3 w-8 h-8 bg-red-500 text-white rounded-full flex items-center justify-center shadow-lg hover:bg-red-600 transition-all z-10">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>

                    <div class="mb-6">
                        <label class="text-[10px] font-black text-blue-500 uppercase mb-2 block" x-text="'Pertanyaan ' + (index + 1)"></label>
                        <textarea x-model="q.text" placeholder="Tuliskan soal di sini..." class="w-full bg-slate-800 border-none rounded-xl p-4 focus:ring-1 focus:ring-blue-500 outline-none text-white text-sm" rows="2"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <template x-for="(opt, optIdx) in q.options" :key="optIdx">
                            <div class="flex items-center gap-3 bg-slate-800 p-3 rounded-xl border border-transparent transition-all" :class="q.correct_answer_index == optIdx ? 'border-emerald-500/50 bg-emerald-500/10' : ''">
                                <input type="radio" :name="'correct_'+index" :value="optIdx" x-model.number="q.correct_answer_index" class="w-4 h-4 accent-emerald-500 cursor-pointer">
                                <input type="text" x-model="q.options[optIdx]" class="bg-transparent border-none outline-none text-sm w-full text-slate-200" :placeholder="'Opsi ' + String.fromCharCode(65+optIdx)">
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <button @click="addQuestion()" class="w-full py-4 border-2 border-dashed border-slate-700 rounded-[2rem] text-slate-500 font-bold hover:border-blue-500 hover:text-blue-500 hover:bg-blue-500/5 transition-all flex items-center justify-center gap-2">
            <i data-lucide="plus" class="w-5 h-5"></i> TAMBAH PERTANYAAN
        </button>

        <button @click="saveQuiz()" :disabled="loading" class="w-full py-5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white rounded-[2rem] font-black text-xl shadow-2xl shadow-blue-900/40 transition-all flex items-center justify-center gap-3">
            <template x-if="!loading">
                <div class="flex items-center gap-3">
                    <i data-lucide="send" class="w-6 h-6"></i> PUBLIKASIKAN UJIAN
                </div>
            </template>
            <template x-if="loading">
                <span class="animate-pulse tracking-widest">MEMPROSES...</span>
            </template>
        </button>
    </div>
</div>

<script>
function createApp() {
    return {
        loading: false,
        quiz: {
            title: '',
            duration: 60,
            questions: [
                { text: '', options: ['', '', '', ''], correct_answer_index: 0 }
            ]
        },

        init() {
            // Cek apakah admin sudah login, jika tidak tendang ke halaman login/admin
            setTimeout(() => {
                if (!netlifyIdentity.currentUser()) {
                    window.location.href = '/admin';
                }
            }, 1000);
            
            if(window.lucide) lucide.createIcons();
        },

        addQuestion() {
            this.quiz.questions.push({
                text: '',
                options: ['', '', '', ''],
                correct_answer_index: 0
            });
            this.$nextTick(() => { if(window.lucide) lucide.createIcons(); });
        },

        removeQuestion(index) {
            if(this.quiz.questions.length > 1) {
                this.quiz.questions.splice(index, 1);
            } else {
                alert("Minimal harus ada 1 pertanyaan.");
            }
        },

        async saveQuiz() {
            // Validasi Sederhana
            if (!this.quiz.title) return alert("Harap isi judul ujian.");
            if (this.quiz.questions.some(q => !q.text)) return alert("Ada pertanyaan yang masih kosong.");
            
            this.loading = true;

            try {
                // Ambil Token JWT dari Netlify Identity
                const user = netlifyIdentity.currentUser();
                const token = await user?.jwt();

                if (!token) {
                    alert("Sesi berakhir, silakan login kembali.");
                    return;
                }

                // Gunakan endpoint manage-quizzes agar seragam (POST)
                const res = await fetch('/.netlify/functions/manage-quizzes', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify(this.quiz)
                });

                const result = await res.json();

                if (res.ok) {
                    alert("Ujian berhasil dipublikasikan!");
                    window.location.href = '/admin';
                } else {
                    throw new Error(result.error || "Gagal menyimpan");
                }
            } catch (e) {
                alert("Terjadi kesalahan: " + e.message);
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
