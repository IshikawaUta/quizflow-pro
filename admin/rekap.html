---
layout: default
title: Rekapitulasi Nilai
---

<div x-data="rekapApp()" x-init="init()" class="max-w-7xl mx-auto py-12 px-6">
    <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
        <div>
            <h1 class="text-4xl font-black italic uppercase tracking-tighter text-white">REKAPITULASI <span class="text-blue-500">NILAI</span></h1>
            <p class="text-slate-400">Total <span class="text-white font-bold" x-text="results.length"></span> pengerjaan tercatat.</p>
        </div>
        <div class="flex gap-4">
            <button @click="exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-2xl font-bold text-white flex items-center gap-2 transition-all shadow-lg shadow-emerald-900/20">
                <i data-lucide="download" class="w-5 h-5"></i> DOWNLOAD CSV
            </button>
            <a href="/admin" class="bg-slate-800 hover:bg-slate-700 px-6 py-3 rounded-2xl font-bold border border-slate-700 text-white flex items-center gap-2 transition-all">
                <i data-lucide="arrow-left" class="w-5 h-5"></i> KEMBALI
            </a>
        </div>
    </div>

    <div x-show="!loading" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         class="glass rounded-[2rem] border border-slate-800 bg-slate-800/30 overflow-hidden shadow-2xl">
        
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-800/50 border-b border-slate-700 text-slate-400 text-[10px] uppercase tracking-[0.2em] font-black">
                    <tr>
                        <th class="p-6">Siswa</th>
                        <th class="p-6">Ujian</th>
                        <th class="p-6 text-center">Kelas / Absen</th>
                        <th class="p-6 text-center">Skor</th>
                        <th class="p-6">Waktu Selesai</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                    <template x-for="item in results" :key="item._id">
                        <tr class="hover:bg-blue-500/5 transition-colors group">
                            <td class="p-6">
                                <div class="font-black text-white uppercase tracking-tight group-hover:text-blue-400 transition-colors" x-text="item.student_name"></div>
                                <div class="text-[10px] text-slate-500 font-bold" x-text="item._id"></div>
                            </td>
                            <td class="p-6">
                                <span class="text-slate-300 font-medium text-sm" x-text="item.quiz_title || 'Ujian Tak Bertajuk'"></span>
                            </td>
                            <td class="p-6 text-center">
                                <div class="flex flex-col items-center">
                                    <span class="bg-slate-700 text-white px-3 py-1 rounded-lg text-xs font-bold mb-1" x-text="item.student_class"></span>
                                    <span class="text-slate-500 text-[10px] font-bold" x-text="'No. Absen ' + item.student_absent"></span>
                                </div>
                            </td>
                            <td class="p-6 text-center">
                                <div class="flex flex-col items-center">
                                    <span class="font-black text-2xl tracking-tighter" 
                                          :class="item.score >= 75 ? 'text-emerald-400' : 'text-rose-500'" 
                                          x-text="item.score"></span>
                                    <span class="text-[9px] font-black uppercase tracking-widest" 
                                          :class="item.score >= 75 ? 'text-emerald-600' : 'text-rose-800'"
                                          x-text="item.score >= 75 ? 'LULUS' : 'REMIDIAL'"></span>
                                </div>
                            </td>
                            <td class="p-6">
                                <div class="text-slate-300 text-sm font-medium" x-text="new Date(item.completed_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })"></div>
                                <div class="text-slate-500 text-xs" x-text="new Date(item.completed_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })"></div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <template x-if="results.length === 0">
            <div class="py-20 text-center flex flex-col items-center justify-center">
                <i data-lucide="database-zap" class="w-12 h-12 text-slate-700 mb-4"></i>
                <p class="text-slate-500 font-bold italic">Belum ada data nilai yang masuk.</p>
            </div>
        </template>
    </div>

    <div x-show="loading" class="flex flex-col items-center justify-center py-32">
        <div class="w-12 h-12 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin mb-4"></div>
        <p class="text-slate-500 font-black italic tracking-widest animate-pulse">MENYINKRONKAN DATA...</p>
    </div>
</div>

<script>
function rekapApp() {
    return {
        results: [],
        loading: true,
        async init() {
            // Memastikan Netlify Identity sudah siap
            const waitForAuth = () => new Promise(resolve => {
                const u = netlifyIdentity.currentUser();
                if (u) resolve(u);
                else netlifyIdentity.on('init', user => resolve(user));
                setTimeout(() => resolve(null), 3000);
            });

            const user = await waitForAuth();
            if (!user) { 
                window.location.href = '/admin'; 
                return; 
            }

            try {
                const token = await user.jwt();
                // Mengambil data dari manage-results.js
                const res = await fetch('/.netlify/functions/manage-results', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    this.results = await res.json();
                } else {
                    console.error("Respon tidak ok:", res.status);
                }
            } catch (e) { 
                console.error("Gagal mengambil rekap:", e); 
            } finally { 
                this.loading = false;
                this.$nextTick(() => {
                    if (window.lucide) lucide.createIcons();
                });
            }
        },
        exportCSV() {
            if (this.results.length === 0) return alert("Tidak ada data untuk diekspor.");

            let csv = "\uFEFFNama,Ujian,Kelas,Absen,Skor,Status,Waktu\n";
            this.results.forEach(r => {
                const status = r.score >= 75 ? "LULUS" : "REMIDIAL";
                const waktu = new Date(r.completed_at).toLocaleString('id-ID').replace(',', '');
                csv += `"${r.student_name}","${r.quiz_title || '-'}","${r.student_class}",${r.student_absent},${r.score},${status},"${waktu}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const dateStr = new Date().toISOString().split('T')[0];
            
            a.href = url;
            a.download = `Rekap_Nilai_${dateStr}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
    }
}
</script>

<style>
    .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(20px); }
    [x-cloak] { display: none !important; }
</style>
